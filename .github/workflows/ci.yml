name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version

      - name: Build
        run: ./scripts/build.sh

      - name: Test (assert-based selftest)
        run: ./.build/Pesa --selftest

      - name: Assemble app bundle
        run: ./scripts/build-app.sh

      - name: Package zip + dmg
        run: ./scripts/package-app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pesa-macos
          path: dist/*
          if-no-files-found: error
